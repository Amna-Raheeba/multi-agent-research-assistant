[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-assistant"
version = "0.2.0"
description = "Supervisor-orchestrated multi-agent research assistant — offline-first, with budget, loop and critic guards"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Amna Raheeba" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research-team = "research_team.cli:main"

[tool.setuptools.packages.find]
include = ["research_team*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
